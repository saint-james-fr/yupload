[package]
name = "yupload"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
default = []
file-locks = ["fs2"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yupload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
image = "0.25"
fast_image_resize = "4.2"
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
anyhow = "1.0"
thiserror = "1.0"
base64 = { version = "0.22", features = ["alloc"] }
oauth2 = { version = "4.4", features = ["reqwest"] }
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "http1"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
rand = "0.8"
bytes = "1.7"
hmac = "0.12"
sha1 = "0.10"
regex = "1.11"
num_cpus = "1.16"
dotenvy = "0.15"
aes-gcm = "0.10"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.11", features = ["v4"] }
libc = "0.2"
fs2 = { version = "0.4", optional = true }
mozjpeg = { version = "0.10.13", features = ["with_simd"] }
tauri-plugin-notification = "2"
lofty = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSWindow", "objc2-core-foundation"] }

